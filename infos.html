<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1NOX • Infos</title>

<style>
/* BACKGROUND ANIMÉ */
body{
    margin:0;
    padding:0;
    background:radial-gradient(circle at top, #1a1a1a, #0a0a0a);
    font-family: 'Segoe UI', sans-serif;
    color:white;
    overflow-x:hidden;
}

/* Glow Discord */
.glow{
    position:fixed;
    top:-150px;
    left:-150px;
    width:350px;
    height:350px;
    background:#5865F2;
    filter:blur(180px);
    opacity:0.25;
    z-index:-1;
    animation:move 12s infinite alternate ease-in-out;
}
@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(120px,120px);}
}

/* HEADER */
.header{
    width:100%;
    padding:20px;
    background:rgba(255,255,255,0.03);
    border-bottom:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    gap:15px;
}
.header img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);
}
.header h1{
    font-size:24px;
    margin:0;
    font-weight:700;
}

/* MOBILE HEADER */
@media(max-width:600px){
    .header{
        padding:15px;
        gap:10px;
    }
    .header img{
        width:45px;
        height:45px;
    }
    .header h1{
        font-size:20px;
    }
}

/* CONTAINER */
.container{
    max-width:900px;
    margin:20px auto;
    padding:15px;
}

/* CARDS ULTRA STYLÉES */
.card{
    background:rgba(255,255,255,0.06);
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.12);
    margin-bottom:20px;
    backdrop-filter:blur(15px);
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px rgba(88,101,242,0.4);
}

.card h2{
    margin-top:0;
    font-size:22px;
    margin-bottom:10px;
    color:#8aa0ff;
}

/* MOBILE CARDS */
@media(max-width:600px){
    .card{
        padding:18px;
        border-radius:15px;
    }
    .card h2{
        font-size:20px;
    }
}

/* LIENS */
a{
    color:#8aa0ff;
    text-decoration:none;
    font-weight:600;
}
a:hover{
    text-decoration:underline;
}

/* BTN RETOUR */
.back-btn{
    padding:14px 25px;
    background:#5865F2;
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-size:18px;
    transition:0.3s;
    font-weight:600;
    width:100%;
}
.back-btn:hover{
    background:#6d78ff;
    transform:translateY(-3px);
}

/* MOBILE BTN */
@media(max-width:600px){
    .back-btn{
        padding:12px;
        font-size:16px;
    }
}

/* 🔒 Cadenas discret */
.secret-btn{
    position:fixed;
    bottom:15px;
    left:15px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:white;
    cursor:pointer;
    backdrop-filter:blur(5px);
    font-size:20px;
    opacity:0.4;
    transition:0.3s;
}
.secret-btn:hover{
    opacity:0.9;
    background:rgba(255,255,255,0.15);
}
</style>
</head>
<body>

<div class="glow"></div>

<!-- HEADER -->
<div class="header">
    <img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg">
    <h1>N1NOX • Infos & Status</h1>
</div>

<!-- CONTENT -->
<div class="container">

    <div class="card">
        <h2>📡 Status du bot</h2>
        <p>🟢 En ligne</p>
    </div>

    <div class="card">
        <h2>📌 Description</h2>
        <p>N1NOX est un bot Discord musique + gestion, rapide, stylé et optimisé.</p>
    </div>

    <div class="card">
        <h2>🔗 Liens utiles</h2>
        <p><a href="#">Inviter le bot</a></p>
        <p><a href="#">Serveur support</a></p>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">⬅️ Retour</button>

</div>

<!-- 🔒 Cadenas discret -->
<div class="secret-btn" onclick="secretBack()">🔓</div>

<script>
function secretBack(){
    let mdp = prompt("Mot de passe :");
    if(mdp === "nnx"){
        window.location.href = "index.html";
    } else {
        alert("❌ Mot de passe incorrect");
    }
}
</script>

</body>
</html>
