<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N1NOX Bot Status</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(-45deg,#0f0f0f,#161616,#1f1f1f,#111111);
background-size:400% 400%;
animation:bg 12s ease infinite;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.5);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-8px);
}
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
overflow:hidden;
border:3px solid rgba(255,255,255,.15);
box-shadow:0 0 25px rgba(255,255,255,.15);
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
margin-top:15px;
font-size:32px;
letter-spacing:2px;
}

.status{
margin-top:20px;
padding:18px;
border-radius:15px;
background:rgba(34,197,94,.15);
border:1px solid rgba(34,197,94,.3);
font-size:24px;
font-weight:bold;
}

.description{
margin-top:15px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,.05);
line-height:1.7;
font-size:15px;
color:#d1d5db;
}

.btn{
width:100%;
border:none;
padding:14px;
margin-top:18px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
background:#2563eb;
transition:.3s;
}

.btn:hover{
transform:scale(1.03);
background:#3b82f6;
}

.footer{
margin-top:15px;
font-size:13px;
color:#9ca3af;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">
<img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg" alt="MR.X Logo">
</div>

<h1>N1NOX BOT</h1>

<div class="status">
🛠️ EN Amélioration
</div>

<div class="description">
🤖 Bot Discord multifonction conçu pour la modération,
les tickets, la sécurité, l'anti-spam et de nombreuses
commandes utiles pour gérer votre serveur efficacement.
</div>

<button class="btn"
onclick="window.open('https://discord.gg/TON_LIEN_DISCORD')">
💬 Rejoindre le serveur Discord
</button>

<div class="footer">
Version 1.0 • Développé par MR.X
</div>

</div>

</body>
</html>
