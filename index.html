<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1NOX</title>

<style>
body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#050505,#101010,#1a1a1a,#0a0a0a);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial, sans-serif;
}
@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:20px;
    text-align:center;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    width:400px;
}

.logo{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:2px solid rgba(255,255,255,0.2);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    margin-top:20px;
    font-size:35px;
    letter-spacing:2px;
}

.btn{
    margin-top:20px;
    padding:15px 25px;
    background:#5865F2;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}
.btn:hover{
    background:#6d78ff;
    transform:translateY(-3px);
}

/* 🔒 Cadenas discret */
.secret-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:white;
    cursor:pointer;
    backdrop-filter:blur(5px);
    font-size:20px;
    opacity:0.4;
    transition:0.3s;
}
.secret-btn:hover{
    opacity:0.9;
    background:rgba(255,255,255,0.15);
}
</style>
</head>
<body>

<div class="card">

    <div class="logo">
        <img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg">
    </div>

    <h1>N1NOX</h1>
    <p style="opacity:0.8;margin-top:10px;">
        Bot Discord rapide, stylé et optimisé.
    </p>

    <!-- Bouton vers la page infos -->
    <button class="btn" onclick="window.location.href='infos.html'">ℹ️ Infos / Status</button>

</div>

<!-- 🔒 Cadenas discret -->
<div class="secret-btn" onclick="secretAccess()">🔒</div>

<script>
function secretAccess(){
    let mdp = prompt("Mot de passe :");
    if(mdp === "nnx"){
        window.location.href = "reparation.html";
    } else {
        alert("❌ Mot de passe incorrect");
    }
}
</script>

</body>
</html>
