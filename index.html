<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNX Bot • Premium Panel</title>

<style>
:root{
    --bg:#05050a;
    --card:rgba(255,255,255,0.08);
    --text:white;
    --status-bg:rgba(255,255,255,0.12);
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:'Poppins', sans-serif;
    color:var(--text);
    overflow:hidden;
    transition:0.4s;
}

/* CANVAS PARTICULES */
#particles{
    position:fixed;
    inset:0;
    z-index:-2;
}

/* Glow animé néon */
.glow{
    position:fixed;
    width:700px;
    height:700px;
    background:linear-gradient(45deg,#5865F2,#8a5bff,#00d4ff,#ff00c8);
    filter:blur(220px);
    animation:move 10s infinite alternate;
    opacity:0.45;
    z-index:-1;
}
@keyframes move{
    0%{top:-200px; left:-200px;}
    100%{top:200px; left:200px;}
}

/* Header image */
.header-img{
    position:fixed;
    top:20px;
    width:100%;
    text-align:center;
    font-size:30px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:0 0 15px #5865F2;
    opacity:0;
    animation:fadeIn 1.5s ease forwards;
}

/* Carte premium + 3D tilt */
.card{
    position:absolute;
    top:52%;
    left:50%;
    transform:translate(-50%, -50%);
    background:var(--card);
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.15);
    width:90%;
    max-width:350px;
    text-align:center;
    opacity:0;
    animation:cardIn 1.2s ease forwards 1s;
    transform-style:preserve-3d;
    transition:transform 0.15s ease;
}
@keyframes cardIn{
    from{opacity:0; transform:translate(-50%, -40%) scale(0.8);}
    to{opacity:1; transform:translate(-50%, -50%) scale(1);}
}

/* Logo rond — plus de glow, mais zoom au clic */
.logo{
    width:130px;
    height:130px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:4px solid rgba(255,255,255,0.25);
    transition:0.3s ease;
}
.logo:active{
    transform:scale(1.15);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* STATUS BOX */
.status-box{
    margin-top:10px;
    background:var(--status-bg);
    padding:20px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 15px #5865F2;
}
.status-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:5px;
}
.status-text{
    font-size:18px;
    opacity:0.9;
}

/* Boutons dégradé animé rainbow — plus lent */
.btn{
    margin-top:18px;
    padding:12px 20px;
    background:linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8a00ff);
    background-size:400%;
    animation:gradientMove 12s infinite linear;
    border:none;
    border-radius:12px;
    color:white;
    font-size:17px;
    cursor:pointer;
    width:100%;
    font-weight:600;
    transition:0.25s;
}
.btn:hover{
    transform:translateY(-3px) scale(1.03);
}
@keyframes gradientMove{
    0%{background-position:0%;}
    100%{background-position:400%;}
}

/* Texte version */
.version{
    margin-top:15px;
    font-size:13px;
    opacity:0.6;
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(10px);
}
.popup-content{
    background:var(--card);
    padding:35px;
    border-radius:20px;
    width:90%;
    max-width:380px;
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    animation:pop 0.4s ease;
}
@keyframes pop{
    from{transform:scale(0.7); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

/* Bouton secret invisible */
.secret-btn{
    position:fixed;
    bottom:15px;
    right:15px;
    width:40px;
    height:40px;
    opacity:0;
    cursor:pointer;
}
</style>
</head>
<body>

<!-- Particules -->
<canvas id="particles"></canvas>

<div class="glow"></div>

<!-- Musique -->
<audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Header -->
<div class="header-img">NNX Bot</div>

<!-- Carte -->
<div class="card">
    <div class="logo">
        <img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg">
    </div>

    <h2 style="margin-top:10px;">✨ N1NOX ✨</h2>

    <!-- STATUS BOX -->
    <div class="status-box">
        <div class="status-title">🎧 DJ Status</div>
        <div class="status-text">🟢 Bot en ligne</div>
    </div>

    <button class="btn" onclick="openInfo()">ℹ️ Infos du bot</button>
    <button class="btn" onclick="window.open('https://discord.gg/KTRCSYec2H','_blank')">💬 Rejoindre le serveur</button>

    <div class="version">Version 1.02.1 — Par N1NOX</div>
</div>

<!-- Popup infos -->
<div class="popup" id="infoPopup">
    <div class="popup-content">
        <h2>📌 Infos du bot</h2>
        <p>🤖 Nom : N1NOX</p>
        <p>🎵 Type : Musique + Gestion</p>
        <p>💎 Style : Premium Discord</p>
        <button class="btn" onclick="closeInfo()">Fermer</button>
    </div>
</div>

<!-- Popup connexion -->
<div class="popup" id="loginPopup">
    <div class="popup-content">
        <h2>🔐 Se connecter</h2>
        <p>Entre ton mot de passe :</p>
        <input id="mdpInput" type="password" placeholder="Mot de passe" style="padding:10px; width:80%; border-radius:10px; border:none; margin-top:15px;">
        <button class="btn" onclick="checkMdp()">Valider</button>
        <button class="btn" style="background:#333; margin-top:10px;" onclick="closeLogin()">Annuler</button>
    </div>
</div>

<!-- Popup lien secret -->
<div class="popup" id="linkPopup">
    <div class="popup-content">
        <h2>🎉 Accès accordé</h2>
        <p><a href="https://discord.gg/KTRCSYec2H" style="color:#6d9bff;">👉 Clique ici pour accéder au lien spécial</a></p>
        <button class="btn" onclick="closeLink()">Fermer</button>
    </div>
</div>

<!-- Bouton secret invisible -->
<div class="secret-btn" onclick="openLogin()"></div>

<script>
/* POPUPS */
function openInfo(){ document.getElementById("infoPopup").style.display="flex"; }
function closeInfo(){ document.getElementById("infoPopup").style.display="none"; }

function openLogin(){ document.getElementById("loginPopup").style.display="flex"; }
function closeLogin(){ document.getElementById("loginPopup").style.display="none"; }

function checkMdp(){
    let mdp = document.getElementById("mdpInput").value;
    if(mdp === "nnx"){
        closeLogin();
        document.getElementById("linkPopup").style.display="flex";
    } else {
        alert("❌ Mauvais mot de passe");
    }
}
function closeLink(){ document.getElementById("linkPopup").style.display="none"; }

/* 3D TILT */
const card = document.querySelector(".card");
document.addEventListener("mousemove", (e) => {
    let x = (window.innerWidth / 2 - e.clientX) / 25;
    let y = (window.innerHeight / 2 - e.clientY) / 25;
    card.style.transform = `translate(-50%, -50%) rotateY(${x}deg) rotateX(${y}deg)`;
});
document.addEventListener("mouseleave", () => {
    card.style.transform = "translate(-50%, -50%) rotateY(0deg) rotateX(0deg)";
});

/* PARTICULES ANIMÉES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2+1,
        speedX:(Math.random()-0.5)*0.3,
        speedY:(Math.random()-0.5)*0.3
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.x+=p.speedX;
        p.y+=p.speedY;
        if(p.x<0||p.x>canvas.width) p.speedX*=-1;
        if(p.y<0||p.y>canvas.height) p.speedY*=-1;
        ctx.fillStyle="white";
        ctx.fillRect(p.x,p.y,p.size,p.size);
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
