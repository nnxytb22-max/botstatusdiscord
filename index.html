<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>N1NOX • Panel Bot (Global Status)</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #ff0055, #0a0a0a 60%);
            background-size: 200% 200%;
            animation: neonBG 8s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes neonBG {
            0% { background-position: 50% 0%; }
            50% { background-position: 50% 100%; }
            100% { background-position: 50% 0%; }
        }

        .navbar {
            background: rgba(0,0,0,0.6);
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 25px;
            box-shadow: 0 0 20px #ff0055;
            position: sticky;
            top: 0;
            backdrop-filter: blur(6px);
            z-index: 10;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        .section {
            padding: 60px 20px;
            max-width: 700px;
            margin: auto;
        }

        .title {
            font-size: 38px;
            font-weight: bold;
            text-shadow: 0 0 15px #ff0055;
            margin-bottom: 20px;
        }

        .box {
            margin: 20px auto;
            width: 90%;
            padding: 25px;
            border-radius: 18px;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 25px #ff0055;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            display: none;
            width: 90%;
            max-width: 300px;
        }

        .online { background: #00c853; box-shadow: 0 0 15px #00c853; }
        .offline { background: #d50000; box-shadow: 0 0 15px #d50000; }
        .repair { background: #ffab00; box-shadow: 0 0 15px #ffab00; }
        .service { background: #6a1b9a; box-shadow: 0 0 15px #6a1b9a; }

        .news-item, .cmd {
            font-size: 18px;
            margin: 10px 0;
            text-align: left;
            padding-left: 10px;
            border-left: 3px solid #ff0055;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#status">🛰️ Status</a>
        <a href="#news">📰 Nouveautés</a>
        <a href="#apropos">ℹ️ À propos</a>
        <a href="#commandes">⚙️ Commandes</a>
    </div>

    <!-- STATUS -->
    <div class="section" id="status">
        <div class="title">🛰️ Status du Bot N1NOX</div>

        <div class="box">
            <div id="statusText" style="font-size:32px;font-weight:bold;margin-bottom:25px;">
                Chargement...
            </div>

            <button id="btn1" class="btn online" onclick="updateStatus('🟢 En ligne')">🟢 En ligne</button>
            <button id="btn2" class="btn offline" onclick="updateStatus('🔴 Hors ligne')">🔴 Hors ligne</button>
            <button id="btn3" class="btn repair" onclick="updateStatus('🛠️ En réparation')">🛠️ En réparation</button>
            <button id="btn4" class="btn service" onclick="updateStatus('🚫 Hors service')">🚫 Hors service</button>
        </div>

        <div onclick="adminLogin()" style="cursor:pointer;opacity:0.7;margin-top:10px;">
            🔐 Accès administrateur
        </div>
    </div>

<script>
/* ========= CONFIG ========= */
const ADMIN_PASSWORD = "N1NOX123"; 
const REPO = "nnxytb22-max/botstatusdiscord";  // TON REPO EXACT
const FILE = "status.json";

let GITHUB_TOKEN = null;

/* ========= LECTURE DU STATUS GLOBAL ========= */
async function loadStatus() {
    try {
        const res = await fetch("status.json?cache=" + Date.now());
        const data = await res.json();
        document.getElementById("statusText").innerHTML = data.status;
    } catch (e) {
        document.getElementById("statusText").innerHTML = "Erreur de chargement du statut";
    }
}

/* ========= MISE À JOUR DU STATUS GLOBAL ========= */
async function updateStatus(text) {
    if (!GITHUB_TOKEN) {
        alert("⚠️ Connecte-toi en admin d'abord !");
        return;
    }

    const content = btoa(JSON.stringify({ status: text }, null, 4));

    const shaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`);
    const shaData = await shaRes.json();

    await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
        method: "PUT",
        headers: {
            "Authorization": `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "Update status",
            content: content,
            sha: shaData.sha
        })
    });

    document.getElementById("statusText").innerHTML = text;
    alert("✅ Statut mis à jour pour tout le monde !");
}

/* ========= LOGIN ADMIN ========= */
function adminLogin() {
    let pass = prompt("Mot de passe admin :");
    if (pass !== ADMIN_PASSWORD) {
        alert("❌ Mauvais mot de passe");
        return;
    }

    let token = prompt("Entre ton token GitHub :");
    if (!token) {
        alert("❌ Token manquant");
        return;
    }

    GITHUB_TOKEN = token;

    document.getElementById("btn1").style.display = "block";
    document.getElementById("btn2").style.display = "block";
    document.getElementById("btn3").style.display = "block";
    document.getElementById("btn4").style.display = "block";

    alert("🔓 Accès admin activé !");
}

/* ========= AU CHARGEMENT ========= */
loadStatus();
</script>

</body>
</html>
