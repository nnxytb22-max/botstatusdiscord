<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1NOX • Panel</title>

<style>
:root{
    --bg:#050509;
    --card:rgba(255,255,255,0.06);
    --text:#ffffff;
}
.light{
    --bg:#f2f2f7;
    --card:rgba(0,0,0,0.06);
    --text:#000000;
}

/* BACKGROUND */
body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:var(--text);
    height:100vh;
    overflow:hidden;
    transition:background 0.3s, color 0.3s;
}

/* Glow Discord */
.glow{
    position:fixed;
    top:-200px;
    right:-200px;
    width:520px;
    height:520px;
    background:#5865F2;
    filter:blur(220px);
    opacity:0.35;
    z-index:-1;
}

/* STATUS */
.status-box{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--card);
    padding:12px 25px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    font-size:18px;
    font-weight:600;
    box-shadow:0 0 20px rgba(88,101,242,0.4);
}

/* CARD */
.card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:var(--card);
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    width:90%;
    max-width:420px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* LOGO */
.logo{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:3px solid rgba(255,255,255,0.25);
    box-shadow:0 0 25px rgba(0,0,0,0.7);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TITRE */
h1{
    margin-top:20px;
    font-size:36px;
    font-weight:800;
    letter-spacing:2px;
}

/* BOUTONS */
.btn{
    margin-top:18px;
    padding:14px 22px;
    background:#5865F2;
    border:none;
    border-radius:12px;
    color:white;
    font-size:17px;
    cursor:pointer;
    font-weight:600;
    width:100%;
    transition:0.25s;
}
.btn:hover{
    background:#6d78ff;
    transform:translateY(-3px);
    box-shadow:0 0 16px rgba(88,101,242,0.7);
}

/* POPUP GENERIQUE */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(10px);
}
.popup-content{
    background:rgba(0,0,0,0.7);
    padding:28px;
    border-radius:20px;
    width:90%;
    max-width:450px;
    border:1px solid rgba(255,255,255,0.18);
    text-align:center;
}

/* CADENAS */
.secret-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:white;
    cursor:pointer;
    backdrop-filter:blur(5px);
    font-size:20px;
    opacity:0.4;
    transition:0.25s;
}
.secret-btn:hover{
    opacity:1;
}

/* MODE SOMBRE/CLAIR */
.mode-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
}
</style>
</head>
<body>

<div class="glow"></div>

<!-- STATUS -->
<div class="status-box" id="status">🟡 Vérification du bot...</div>

<!-- CARD PRINCIPALE -->
<div class="card">
    <div class="logo">
        <img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg" alt="N1NOX">
    </div>

    <h1>N1NOX</h1>

    <button class="btn" onclick="openPopup()">ℹ️ Infos du bot</button>
    <button class="btn" onclick="window.location.href='https://discord.gg/tonserveur'">💬 Rejoindre le serveur Discord</button>
</div>

<!-- POPUP INFOS -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>📌 Infos du bot</h2>
        <p>• Nom : N1NOX</p>
        <p>• Type : Musique + Gestion</p>
        <p>• Vitesse : ⚡ Ultra rapide</p>
        <p>• Style : 💎 Premium Discord</p>
        <button class="btn" onclick="closePopup()">Fermer</button>
    </div>
</div>

<!-- POPUP SECRET -->
<div class="popup" id="secretPopup">
    <div class="popup-content">
        <h2>🎉 Tu viens de trouver un truc secret !</h2>
        <p>Respect, peu de gens cliquent ici.</p>
        <a href="https://google.com" style="color:#8aa0ff; font-size:18px;">🔗 Lien secret</a>
        <br><br>
        <button class="btn" onclick="closeSecret()">Fermer</button>
    </div>
</div>

<!-- CADENAS SECRET -->
<div class="secret-btn" onclick="secretAccess()">🔒</div>

<!-- MODE SOMBRE / CLAIR -->
<div class="mode-btn" onclick="toggleMode()">🌙</div>

<script>
/* POPUP INFOS */
function openPopup(){ document.getElementById("popup").style.display="flex"; }
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* POPUP SECRET */
function secretAccess(){
    let mdp = prompt("Mot de passe :");
    if(mdp === "nnx"){
        document.getElementById("secretPopup").style.display="flex";
    } else {
        alert("❌ Mot de passe incorrect");
    }
}
function closeSecret(){ document.getElementById("secretPopup").style.display="none"; }

/* MODE SOMBRE/CLAIR */
function toggleMode(){
    document.body.classList.toggle("light");
}

async function checkStatus(){
    try{
        const res = await fetch("https://api.jsonbin.io/v3/b/6a2d4399da38895dfeb9daef");
        const data = await res.json();

        const now = Date.now() / 1000;

        if(now - data.record.last < 40){
            document.getElementById("status").innerHTML = "🟢 Bot en ligne";
        } else {
            window.location.href = "reparation.html";
        }
    }catch{
        window.location.href = "reparation.html";
    }
}

checkStatus();
setInterval(checkStatus, 7000);


checkStatus();
setInterval(checkStatus, 7000);
</script>

</body>
</html>
