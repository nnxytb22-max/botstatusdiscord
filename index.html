<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1NOX • Panel</title>

<style>
:root{
    --bg:#0a0a0a;
    --card:rgba(255,255,255,0.06);
    --text:white;
}
.light{
    --bg:#f2f2f2;
    --card:rgba(0,0,0,0.06);
    --text:black;
}

/* BACKGROUND */
body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:'Segoe UI', sans-serif;
    color:var(--text);
    height:100vh;
    overflow:hidden;
    transition:0.3s;
}

/* Glow Discord */
.glow{
    position:fixed;
    top:-200px;
    right:-200px;
    width:500px;
    height:500px;
    background:#5865F2;
    filter:blur(200px);
    opacity:0.25;
    z-index:-1;
}

/* STATUS */
.status-box{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--card);
    padding:12px 25px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    font-size:20px;
    font-weight:600;
    box-shadow:0 0 20px rgba(88,101,242,0.4);
}

/* CARD */
.card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:var(--card);
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
    width:90%;
    max-width:420px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* LOGO */
.logo{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    border:3px solid rgba(255,255,255,0.2);
}
.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TITRE */
h1{
    margin-top:20px;
    font-size:38px;
    font-weight:800;
}

/* BOUTONS */
.btn{
    margin-top:20px;
    padding:15px 25px;
    background:#5865F2;
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
    font-weight:600;
    width:100%;
    transition:0.3s;
}
.btn:hover{
    background:#6d78ff;
    transform:translateY(-3px);
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(10px);
}
.popup-content{
    background:rgba(0,0,0,0.6);
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:450px;
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
}

/* CADENAS */
.secret-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    color:white;
    cursor:pointer;
    backdrop-filter:blur(5px);
    font-size:20px;
    opacity:0.4;
}
.secret-btn:hover{
    opacity:1;
}

/* MODE SOMBRE/CLAIR */
.mode-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:8px 12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
}
</style>
</head>
<body>

<div class="glow"></div>

<!-- STATUS -->
<div class="status-box" id="status">🟡 Vérification...</div>

<!-- CARD -->
<div class="card">

    <div class="logo">
        <img src="df3e89bb5ae9a3595a3e99fcba82998f.jpg">
    </div>

    <h1>N1NOX</h1>

    <button class="btn" onclick="openPopup()">ℹ️ Infos du bot</button>

    <button class="btn" onclick="window.location.href='https://discord.gg/tonserveur'">💬 Rejoindre le serveur Discord</button>

</div>

<!-- POPUP INFOS -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>📌 Infos du bot</h2>
        <p>• Nom : N1NOX</p>
        <p>• Type : Musique + Gestion</p>
        <p>• Style : Premium Discord</p>
        <button class="btn" onclick="closePopup()">Fermer</button>
    </div>
</div>

<!-- POPUP SECRET -->
<div class="popup" id="secretPopup">
    <div class="popup-content">
        <h2>🎉 Tu viens de trouver un truc secret !</h2>
        <a href="https://google.com" style="color:#8aa0ff; font-size:18px;">🔗 Lien secret</a>
        <br><br>
        <button class="btn" onclick="closeSecret()">Fermer</button>
    </div>
</div>

<!-- POPUP REPARATION -->
<div class="popup" id="repairPopup">
    <div class="popup-content">
        <h2>🛠️ Bot hors ligne</h2>
        <p>Le bot est actuellement en maintenance.</p>
    </div>
</div>

<!-- CADENAS -->
<div class="secret-btn" onclick="secretAccess()">🔒</div>

<!-- MODE SOMBRE/CLAIR -->
<div class="mode-btn" onclick="toggleMode()">🌙</div>

<script>
/* POPUP INFOS */
function openPopup(){ document.getElementById("popup").style.display="flex"; }
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* POPUP SECRET */
function secretAccess(){
    let mdp = prompt("Mot de passe :");
    if(mdp === "nnx"){
        document.getElementById("secretPopup").style.display="flex";
    } else {
        alert("❌ Mot de passe incorrect");
    }
}
function closeSecret(){ document.getElementById("secretPopup").style.display="none"; }

/* MODE SOMBRE/CLAIR */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* STATUS RÉEL UPTIMEROBOT */
async function checkStatus(){
    try{
        let res = await fetch("https://api.uptimerobot.com/v2/getMonitors", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                "api_key": "ur3523333-2f6f2e858f21fa4282e83a6a",
                "format": "json"
            })
        });

        let data = await res.json();
        let status = data.monitors[0].status;

        if(status === 2){
            document.getElementById("status").innerHTML = "🟢 Bot en ligne";
        } else {
            document.getElementById("status").innerHTML = "🔴 Bot hors ligne";
            document.getElementById("repairPopup").style.display = "flex";
        }

    }catch(e){
        document.getElementById("status").innerHTML = "⚠️ Erreur API";
    }
}

checkStatus();
setInterval(checkStatus, 5000);
</script>

</body>
</html>
