<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N1NOX • Maintenance</title>

<style>
body{
    margin:0;
    padding:0;
    background:#050509;
    font-family:'Segoe UI', system-ui, sans-serif;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

/* Glow */
.glow{
    position:fixed;
    top:-200px;
    left:-200px;
    width:520px;
    height:520px;
    background:#ff4757;
    filter:blur(220px);
    opacity:0.35;
    z-index:-1;
}

.box{
    background:rgba(255,255,255,0.06);
    padding:40px 30px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(18px);
    max-width:420px;
    width:90%;
    box-shadow:0 0 40px rgba(0,0,0,0.7);
}
h1{
    font-size:30px;
    margin-bottom:10px;
}
p{
    opacity:0.85;
    margin-bottom:20px;
}
.btn{
    margin-top:10px;
    padding:12px 20px;
    background:#5865F2;
    border:none;
    border-radius:12px;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
    transition:0.25s;
}
.btn:hover{
    background:#6d78ff;
    transform:translateY(-2px);
}
</style>
</head>
<body>

<div class="glow"></div>

<div class="box">
    <h1>🛠️ Bot en maintenance</h1>
    <p>Le bot N1NOX est actuellement hors ligne ou en mise à jour.<br>Réessaie dans quelques minutes.</p>
    <button class="btn" onclick="window.location.href='index.html'">↩️ Revenir au panel</button>
</div>

</body>
</html>
